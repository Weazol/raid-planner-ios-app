<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keine Verbindung</title>
  <style>
    :root {
      --bg: #061933; --surface: #0b2545; --line: #1e4470;
      --text: #e6f1f7; --muted: #9fb6c8; --primary: #39b7cd; --on-primary: #04222b;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .panel { max-width: 360px; width: 100%; text-align: center; background: var(--surface);
      border: 1px solid var(--line); border-radius: 12px; padding: 32px 24px; }
    img { width: 120px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { appearance: none; border: 0; border-radius: 8px; background: var(--primary);
      color: var(--on-primary); font: inherit; font-weight: 600; padding: 12px 28px; }
    button:active { opacity: .8; }
    a { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="panel">
    <img src="logo.svg" alt="">
    <h1>Keine Verbindung</h1>
    <p>Der Raid-Planner ist gerade nicht erreichbar. Prüfe deine Internetverbindung oder die eingetragene Adresse.</p>
    <button id="retry" type="button">Erneut versuchen</button>
    <br><a href="index.html">Adresse ändern</a>
  </div>
  <script>
    // The app passes its server.url (capacitor.config.json); only http(s) targets are followed.
    var target = new URLSearchParams(location.search).get('url');
    var appUrl = /^https?:\/\//.test(target || '') ? target : null;
    function retry() { if (appUrl) { location.replace(appUrl); } }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
